name: Service enquiry
description: Request a scoped continuity review, audit, playbook, or workshop
title: "[Service enquiry] "
labels:
  - service-enquiry
body:
  - type: markdown
    attributes:
      value: |
        This creates a PUBLIC GitHub issue. For a private enquiry, email danaaliramontes@gmail.com instead.
        Please share only sanitized, non-confidential information.
        This is an enquiry, not an order or payment commitment. See https://danaaliramontes.github.io/services.html for the current offers.
        Scope, acceptance criteria, final total including applicable taxes, payment route and delivery window must be agreed before work begins.
        Never include passwords, tokens, cookies, private keys, personal data, or production secrets.
  - type: textarea
    id: system
    attributes:
      label: System or workflow
      description: What kind of agent, workflow, or automation would you like reviewed?
      placeholder: "For example: a RAG assistant, n8n workflow, or local agent"
    validations:
      required: true
  - type: dropdown
    id: service
    attributes:
      label: Requested service
      options:
        - Continuity Triage
        - Full Continuity and Recovery Audit
        - Implementation Sprint
        - Persistent Agent Templates Pack
        - Other scoped enquiry
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What would a useful result look like?
    validations:
      required: true
  - type: input
    id: timeframe
    attributes:
      label: Preferred timeframe
      placeholder: "For example: within two weeks"
  - type: textarea
    id: constraints
    attributes:
      label: Constraints and sanitized context
      description: Include relevant limits such as model, hosting, or compliance requirements. Do not include secrets.
